name: traveler

services:
  # PostgreSQL master: the application reads and writes here.
  # wal_level=replica is enough for physical (streaming) replication;
  # on the first start 500_orchestrate.sh applies migrations and creates repuser.
  db:
    image: postgres:16-alpine
    container_name: traveler_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    command:
      - "postgres"
      - "-c"
      - "listen_addresses=*"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-migrations:ro
      - ./db/replications/publisher:/docker-entrypoint-replications:ro
      - ./db/replications/common:/docker-entrypoint-initdb.d:ro
    networks:
      - traveler_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # PostgreSQL physical replica (hot standby): on the first start clones the
  # master with pg_basebackup, then continuously replays its WAL.
  # Read-only; schema changes (DDL) are replicated automatically.
  db_replica:
    image: postgres:16-alpine
    container_name: traveler_db_replica
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    entrypoint: ["bash", "/docker-entrypoint-standby/init_standby.sh"]
    volumes:
      - pgdata_replica:/var/lib/postgresql/data
      - ./db/replications/standby:/docker-entrypoint-standby:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - traveler_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Spring Boot REST API (TravelerAPI): works with the master only.
  # Starts only after the master database reports healthy.
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: traveler-api:latest
    container_name: traveler_api
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://${DB_HOST:-db}:5432/${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_CACHE_PLANS_ENABLED: ${CACHE_ENABLED:-false}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - traveler_network
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # Named volumes: master and replica keep their data separately
  pgdata:
  pgdata_replica:

networks:
  traveler_network:
    driver: bridge